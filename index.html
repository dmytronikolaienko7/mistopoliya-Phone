<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mistopoliya 🎲</title><style>
:root{--bg:#edf7ff;--card:#fff;--btn:#b9e1fa;--accent:#5daee5;--ink:#20304c;--muted:#64748b;--line:#d9eaf7;--soft:#f5fbff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} [hidden]{display:none!important}
html{background:var(--bg)}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;padding:12px;transition:background .2s}
header{max-width:1150px;margin:8px auto 16px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px 16px;text-align:center;box-shadow:0 8px 25px #467eac12}
header:before{content:'ГРА ПРОТИ ШТУЧНОГО ІНТЕЛЕКТУ';display:block;font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--accent);margin-bottom:6px}
h1{margin:0 0 5px;font-size:clamp(29px,5vw,44px);letter-spacing:-.04em}h2{margin:0 0 13px;font-size:22px}h3{margin:16px 0 8px}small{color:var(--muted)}
main{max-width:1150px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(7,minmax(0,1fr));overflow-anchor:none;aspect-ratio:1;background:#e6f5ff;border:5px solid var(--accent);border-radius:20px;overflow:hidden;box-shadow:0 8px 24px #467eac20}
.tile{border:1px solid #cbdfea;background:#fff;min-width:0;padding:4px;text-align:center;font-size:clamp(8px,1.2vw,12px);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
/* Повністю забарвлені міста: чотири пастельні групи */
.tile.city{background:var(--city);border-color:color-mix(in srgb,var(--city) 65%,#879db1);transition:background .25s ease}
.tile.city b{color:#192c46;text-shadow:0 1px 1px #ffffffa8}
.tile.city .stripe{background:color-mix(in srgb,var(--city) 88%,#536078);height:7px}
.tile .stripe{height:9px;background:var(--c,#d9eaf7);border-radius:5px}.tile b{overflow-wrap:anywhere}.tile .tokens{display:flex;justify-content:center;align-items:flex-end;flex-wrap:wrap;gap:1px;line-height:1}.figurine{width:22px;height:29px;filter:drop-shadow(0 2px 1px #0002);vertical-align:middle}.player .figurine{width:27px;height:34px}
.center{grid-column:2/7;grid-row:2/7;display:grid;place-content:center;text-align:center;padding:12px;background:radial-gradient(circle,#fff,#d6efff)}.center strong{font-size:clamp(23px,5vw,58px);color:var(--ink)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 8px 25px #467eac14}
button,select{font:inherit;border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin:5px 0;background:var(--btn);color:var(--ink);cursor:pointer;width:100%;font-weight:750;touch-action:manipulation;appearance:none;-webkit-appearance:none;min-height:46px}
button:hover:not(:disabled){filter:brightness(.97);transform:translateY(-1px)}button:active:not(:disabled){transform:scale(.99)}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}button:disabled{opacity:.42;cursor:default}.secondary{background:#eef2f7;color:var(--ink)}
label{display:block;margin:10px 0 3px;font-weight:700}.player{padding:11px;border-radius:12px;background:var(--soft);border:1px solid var(--line);margin:7px 0}.active{outline:2px solid var(--accent);background:#e8f5ff}
.log{height:150px;overflow:auto;background:var(--soft);padding:10px;border-radius:12px;border:1px solid var(--line);font-size:13px}.dice{font-size:38px;text-align:center;padding:7px}
#setup{max-width:470px;margin:22px auto}#setup:before{content:'🤖 Грай проти комп’ютера';display:block;color:var(--muted);margin-bottom:14px}
.themebar{max-width:1150px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}.themebar span{font-weight:700;font-size:13px}.themebar button{width:auto;min-height:35px;margin:0;padding:6px 12px;font-size:13px;background:var(--card)}
@media(max-width:760px){body{padding:7px}header{padding:16px 10px;border-radius:17px}main{grid-template-columns:minmax(0,1fr);gap:12px}.board{aspect-ratio:1;border-width:3px;border-radius:12px}.tile{font-size:clamp(6px,1.65vw,10px);padding:1px}.tile .figurine{width:clamp(10px,2.8vw,18px);height:clamp(13px,3.7vw,24px)}.tile .stripe{height:5px}.panel{padding:14px;border-radius:16px}.center{padding:3px}.center strong{font-size:clamp(19px,5vw,34px)}}

.newgame{display:block;margin:0 0 22px auto;width:auto;min-height:36px;padding:6px 12px;font-size:12px;background:#f1f3f6;color:#526178;border:1px solid #d6dce5;opacity:.88}
.newgame:hover{opacity:1}

/* Справжні 3D-кубики: шість граней з перспективою */
.board-dice{display:flex;justify-content:center;align-items:center;gap:clamp(20px,4vw,44px);margin-top:20px;perspective:420px;min-height:135px}
.die{--ds:clamp(44px,7vw,70px);position:relative;width:var(--ds);height:var(--ds);flex:none;transform-style:preserve-3d;transform:rotateX(-24deg) rotateY(-32deg);}
.die .face{position:absolute;inset:0;border-radius:12%;border:2px solid #8da1bb;background:linear-gradient(135deg,#fff 5%,#e7eef9 70%,#b1c2d8);box-shadow:inset 2px 2px 5px #fff,inset -3px -3px 8px #8ca0ba55;backface-visibility:hidden}
.die::after{content:"";position:absolute;width:90%;height:24%;left:5%;top:98%;border-radius:50%;background:#233c5b45;filter:blur(9px);transform:translateZ(-45px)}
.die .front{transform:translateZ(calc(var(--ds)/2))}
.die .back{transform:rotateY(180deg) translateZ(calc(var(--ds)/2))}
.die .right{transform:rotateY(90deg) translateZ(calc(var(--ds)/2))}
.die .left{transform:rotateY(-90deg) translateZ(calc(var(--ds)/2))}
.die .top{transform:rotateX(90deg) translateZ(calc(var(--ds)/2))}
.die .bottom{transform:rotateX(-90deg) translateZ(calc(var(--ds)/2))}
.die .pip{position:absolute;width:17%;height:17%;border-radius:50%;background:radial-gradient(circle at 30% 25%,#455975,#13243c 75%);box-shadow:inset 1px 2px 2px #0b1836a6,0 1px 1px #fff9;transform:translate(-50%,-50%)}
.die .pip[data-p="tl"]{left:24%;top:24%}.die .pip[data-p="tc"]{left:50%;top:24%}.die .pip[data-p="tr"]{left:76%;top:24%}.die .pip[data-p="ml"]{left:24%;top:50%}.die .pip[data-p="mc"]{left:50%;top:50%}.die .pip[data-p="mr"]{left:76%;top:50%}.die .pip[data-p="bl"]{left:24%;top:76%}.die .pip[data-p="bc"]{left:50%;top:76%}.die .pip[data-p="br"]{left:76%;top:76%}
.board-dice.throwing .die:first-child{animation:throwDieA 1.4s cubic-bezier(.22,.65,.3,1) both}
.board-dice.throwing .die:last-child{animation:throwDieB 1.4s cubic-bezier(.22,.65,.3,1) both}
@keyframes throwDieA{0%{transform:translate(-32px,-80px) rotateX(-45deg) rotateY(15deg) rotateZ(-40deg) scale(.8)}32%{transform:translate(-10px,-40px) rotateX(410deg) rotateY(315deg) rotateZ(190deg) scale(1.15)}54%{transform:translate(18px,0) rotateX(710deg) rotateY(590deg) rotateZ(350deg)}72%{transform:translate(13px,-23px) rotateX(770deg) rotateY(670deg) rotateZ(390deg)}90%{transform:translate(2px,-5px) rotateX(700deg) rotateY(680deg) rotateZ(360deg)}100%{transform:translate(0,0) rotateX(696deg) rotateY(688deg) rotateZ(360deg)}}
@keyframes throwDieB{0%{transform:translate(32px,-75px) rotateX(45deg) rotateY(-20deg) rotateZ(35deg) scale(.8)}32%{transform:translate(12px,-34px) rotateX(-390deg) rotateY(-290deg) rotateZ(-170deg) scale(1.12)}54%{transform:translate(-18px,0) rotateX(-690deg) rotateY(-590deg) rotateZ(-350deg)}72%{transform:translate(-10px,-25px) rotateX(-760deg) rotateY(-650deg) rotateZ(-390deg)}90%{transform:translate(-2px,-4px) rotateX(-700deg) rotateY(-680deg) rotateZ(-360deg)}100%{transform:translate(0,0) rotateX(-744deg) rotateY(-752deg) rotateZ(-360deg)}}
@media(prefers-reduced-motion:reduce){.board-dice.throwing .die{animation:none}}

function land(){let p=ps[turn],i=p.pos;pending=-1;chanceText='';msg(p.name+' потрапив на «'+names[i]+'»');if(i===18){p.pos=6;p.jail=2;rolledDouble=false;msg('Відправлено до в’язниці!')}else if(i===4){pay(150,-1);msg('Податок: 150 🪙')}else if([2,8,14,20].includes(i)){let cards=[
['🎁 Подарунок міста: +150 🪙',150],['💼 Премія за роботу: +200 🪙',200],
['🛠️ Ремонт дороги: −80 🪙',-80],['📚 Міський збір: −120 🪙',-120],
['🍀 Вдалий день: +100 🪙',100],['🏆 Нагорода за розвиток: +250 🪙',250],
['🎪 Міське свято: +90 🪙',90],['📦 Загублений пакунок: +130 🪙',130],
['🚧 Ремонт мосту: −60 🪙',-60],['🎨 Фестиваль: +180 🪙',180],
['🚆 Квиток на поїзд: −50 🪙',-50],['🧩 Перемога у конкурсі: +220 🪙',220],
['🌳 Допомога парку: −70 🪙',-70],['🎓 Стипендія: +110 🪙',110],
['🎯 Успішна інвестиція: +170 🪙',170],['🏙️ Міський грант: +140 🪙',140]
];let c=cards[Math.floor(Math.random()*cards.length)];chanceText='🎴 ШАНС — '+c[0];if(turn===0){gameStats.chances++;if(c[1]>0)gameStats.earned+=c[1]}if(c[1]<0)pay(-c[1],-1);else p.money+=c[1];msg(chanceText)}else if(property(i)){if(owner[i]===-1){if(p.money>=price(i))pending=i;else msg('Не вистачає монет для купівлі')}else if(owner[i]!==turn){let cost=rent(i);pay(cost,owner[i]);msg('Оренда '+cost+' 🪙 для '+ps[owner[i]].name)}}checkWin()}function buy(){if(pending<0||phase!=='decision')return;ps[turn].money-=price(pending);owner[pending]=turn;if(turn===0)gameStats.buys++;msg(ps[turn].name+' купив '+names[pending]);pending=-1;render()}function build(){let i=ps[turn].pos;if(!canBuild())return;ps[turn].money-=Math.ceil(price(i)/2);houses[i]++;if(turn===0)gameStats.builds++;msg((houses[i]===4?'Готель':'Будинок')+' у місті '+names[i]+' побудовано');render()}function checkWin(){let alive=ps.filter(p=>p.alive);if(alive.length===1){phase='finished';if(!wonRecorded){wonRecorded=true;recordResult(alive[0]);}msg('🏆 Переміг '+alive[0].name+'!');$('info').textContent='🏆 Переміг '+alive[0].name;return true}return false}function endTurn(){if(phase!=='decision')return;if(checkWin()){render();return}pending=-1;rolledDouble=false;consecutive=0;if(turn===0)gameStats.turns++;do{turn=(turn+1)%ps.length}while(!ps[turn].alive);phase='roll';render();scheduleBot()}
function scheduleBot(){clearTimeout(botTimer);if(phase==='finished'||!ps[turn]?.bot)return;botTimer=setTimeout(botStep,650)}
function botStep(){if(phase==='finished'||!ps[turn]?.bot)return;if(phase==='roll'){roll().then(()=>scheduleBot());return}if(phase==='decision'){let p=ps[turn];let reserve={easy:430,normal:240,hard:100}[difficulty];
if(p.alive&&pending>=0){const group=cityGroups.find(g=>g.includes(pending))||[];
 const owned=group.filter(i=>owner[i]===turn).length;
 const bonus=difficulty==='hard'?owned*75:difficulty==='normal'?owned*30:0;
 if(p.money>=price(pending)+Math.max(40,reserve-bonus))buy();}
if(p.alive&&canBuild()&&p.money>=Math.ceil(price(p.pos)/2)+reserve)build();
if(p.alive&&difficulty!=='easy'&&loans[turn]>0&&p.money>loans[turn]+reserve+300){p.money-=loans[turn];loans[turn]=0;}
if(p.alive&&difficulty==='hard'&&p.money<120){const city=owner.findIndex((o,i)=>o===turn&&property(i)&&houses[i]===0);if(city>=0){p.money+=Math.round(price(city)*.7);owner[city]=-1;}}
endTurn()}}


const RECORDS='mistopoliya-records-v1';
function readRecords(){try{return JSON.parse(localStorage.getItem(RECORDS)||'{"games":0,"wins":0,"best":0,"last":[]}')}catch(e){return {games:0,wins:0,best:0,last:[]}}}
function recordResult(winner){const r=readRecords();r.games++;if(!winner.bot){r.wins++;const score=ps[0].money+owner.reduce((sum,v,i)=>sum+(v===0?price(i)+houses[i]*Math.ceil(price(i)/2):0),0)-loans[0];r.best=Math.max(r.best,score)}r.last=[{name:winner.name,turns:gameStats.turns,date:new Date().toLocaleDateString('uk-UA')},...(r.last||[])].slice(0,5);try{localStorage.setItem(RECORDS,JSON.stringify(r))}catch(e){}}
function renderEconomy(){
if(!ps.length)return;const mine=owner.map((v,i)=>v===0&&property(i)?i:-1).filter(i=>i>=0);
const select=$('sellCity'),prev=select.value;select.innerHTML='<option value="">Вибери місто для продажу</option>'+mine.map(i=>'<option value="'+i+'">'+names[i]+' — '+Math.round(price(i)*.7+houses[i]*Math.ceil(price(i)/2)*.5)+' 🪙</option>').join('');
if(prev&&mine.includes(Number(prev)))select.value=prev;
const active=turn===0&&phase==='decision'&&ps[0].alive;
$('sellBtn').disabled=!active||!mine.length;$('loanBtn').disabled=!active||loans[0]>0;$('repayBtn').disabled=!active||!loans[0]||ps[0].money<loans[0];
$('loanInfo').textContent=loans[0]?'Борг: '+loans[0]+' 🪙':'Боргів немає. Кредит 300 🪙, повернути 360 🪙.';
const r=readRecords();
$('stats').textContent='Ходів: '+gameStats.turns+' · Міст куплено: '+gameStats.buys+' · Будівель: '+gameStats.builds+' · Карток «Шанс»: '+gameStats.chances+' · Обмінів: '+gameStats.trade;
const badges=[['🏙️ Перший власник',gameStats.buys>=1],['🏘️ Будівельник',gameStats.builds>=1],['🎴 Щасливчик',gameStats.chances>=3],['🤝 Дипломат',gameStats.trade>=1],['💰 Магнат',ps[0].money>=2500],['🏆 Переможець',r.wins>=1]];
$('achievements').innerHTML=badges.map(([name,done])=>'<span class="achievement '+(done?'unlocked':'')+'">'+(done?'✓ ':'🔒 ')+name+'</span>').join('');
$('records').textContent='Партій: '+r.games+' · Перемог: '+r.wins+' · Найкращий капітал: '+r.best+' 🪙'+(r.last.length?' · Останній переможець: '+r.last[0].name:'');
}
function takeLoan(){if(turn!==0||phase!=='decision'||loans[0]>0)return;ps[0].money+=300;loans[0]=360;msg('🏦 Банк видав 300 🪙. Повернути 360 🪙');render()}
function repayLoan(){if(turn!==0||phase!=='decision'||!loans[0]||ps[0].money<loans[0])return;ps[0].money-=loans[0];loans[0]=0;msg('💸 Кредит погашено!');render()}
function sellCity(){const val=$('sellCity').value;if(turn!==0||phase!=='decision'||val==='')return;const i=Number(val);if(owner[i]!==0||!property(i))return;const payout=Math.round(price(i)*.7+houses[i]*Math.ceil(price(i)/2)*.5);owner[i]=-1;houses[i]=0;ps[0].money+=payout;msg('💰 Продано '+names[i]+' за '+payout+' 🪙');render()}

const SAVE='mistopolia-save-3';
function saveGame(){if(!ps.length||rolling||phase==='moving')return;try{localStorage.setItem(SAVE,JSON.stringify({ps,owner,houses,turn,phase,pending,rolledDouble,consecutive,lastDice,difficulty,chanceText,selectedToken,loans,gameStats,wonRecorded,botTokens:tokens.slice(1,ps.length).map(markup=>Object.keys(tokenChoices).find(key=>markup===tokenMarkup(key))||null)}))}catch(e){}}
function loadSave(){try{let x=JSON.parse(localStorage.getItem(SAVE));if(!x||!Array.isArray(x.ps)||x.owner.length!==24)throw Error();({ps,owner,houses,turn,phase,pending,rolledDouble,consecutive,lastDice,difficulty,chanceText}=x);loans=Array.isArray(x.loans)&&x.loans.length===ps.length?x.loans:Array(ps.length).fill(0);gameStats=x.gameStats||{turns:0,buys:0,builds:0,chances:0,earned:0,trade:0};wonRecorded=!!x.wonRecorded;rolledDouble=false;consecutive=0;startBonusText=x.startBonusText||'';selectedToken=tokenChoices[x.selectedToken]?x.selectedToken:'car';tokens[0]=tokenMarkup(selectedToken);if(Array.isArray(x.botTokens)){x.botTokens.forEach((key,i)=>{if(tokenChoices[key])tokens[i+1]=tokenMarkup(key)})}$('setup').hidden=true;$('game').hidden=false;render();scheduleBot()}catch(e){alert('Збереження не знайдено')}}
function renderTrade(){let bot=$('tradeBot'),mine=$('tradeMine'),theirs=$('tradeTheirs');if(!bot||!ps.length)return;let prev=bot.value;bot.innerHTML=ps.map((p,i)=>p.bot&&p.alive?'<option value="'+i+'">'+p.name+'</option>':'').join('');if([...bot.options].some(o=>o.value===prev))bot.value=prev;let b=Number(bot.value),m=mine.value,t=theirs.value;mine.innerHTML='<option value="">Моє місто</option>'+owner.map((v,i)=>v===0&&property(i)&&!houses[i]?'<option value="'+i+'">'+names[i]+'</option>':'').join('');theirs.innerHTML='<option value="">Місто комп’ютера</option>'+owner.map((v,i)=>v===b&&property(i)&&!houses[i]?'<option value="'+i+'">'+names[i]+'</option>':'').join('');if(m&&owner[Number(m)]===0)mine.value=m;if(t&&owner[Number(t)]===b)theirs.value=t}
function tradeCities(){let b=Number($('tradeBot').value),a=Number($('tradeMine').value),c=Number($('tradeTheirs').value);if(turn!==0||phase!=='decision')return $('tradeStatus').textContent='Обмін можливий після твого кидка.';if(!$('tradeMine').value||!$('tradeTheirs').value||owner[a]!==0||owner[c]!==b||houses[a]||houses[c])return $('tradeStatus').textContent='Вибери два міста без будинків.';let group=cityGroups.find(g=>g.includes(a))||[],helps=group.filter(i=>owner[i]===b).length===group.length-1;let fair=price(a)+(helps?200:0)>=price(c)*({easy:.85,normal:1,hard:1.15}[difficulty]);if(fair){owner[a]=b;owner[c]=0;gameStats.trade++;msg('🤝 Обмін успішний!');$('tradeStatus').textContent='✅ Обмін прийнято!';render()}else $('tradeStatus').textContent='❌ Комп’ютер відмовився від обміну.'}
$('tradeBot').addEventListener('change',renderTrade);
window.addEventListener('pagehide',saveGame);
try{$('resume').hidden=!localStorage.getItem(SAVE)}catch(e){}

/* Mobile tabs move the existing functional controls, not clones. */
const mobileSections=[
 ['myCityCards','tabProperty'],['.trade','tabFinance'],['.economy','tabFinance'],
 ['.economy:nth-of-type(3)','tabProfile'],['.side-themes','tabSettings']
];
const mobileNodes=[];
function setupMobileNodes(){
 const cards=document.getElementById('myCityCards');
 const trade=cards.querySelector('.trade');
 const economies=[...cards.querySelectorAll(':scope > .economy')];
 const themes=document.querySelector('#game > .side-themes');
 for(const [node,dest] of [[cards,'tabProperty'],[trade,'tabFinance'],[economies[0],'tabFinance'],[economies[1],'tabProfile'],[themes,'tabSettings']]){
  if(!node)continue;
  const marker=document.createComment('Original position: '+dest);
  node.parentNode.insertBefore(marker,node);
  mobileNodes.push({node,marker,dest});
 }
}
let currentMobileTab='property',isMobileTabs=false;
function showMobileTab(name){
 currentMobileTab=name;
 for(const n of ['property','finance','profile','settings']){
  const el=document.getElementById('tab'+n[0].toUpperCase()+n.slice(1));
  el.hidden=n!==name;
 }
 document.querySelectorAll('.mobile-tab-nav button').forEach(b=>{
  const active=b.dataset.tab===name;b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active));
 });
}
function updateMobileLayout(){
 const mobile=window.matchMedia('(max-width:760px)').matches;
 if(mobile===isMobileTabs)return;
 isMobileTabs=mobile;
 const tabs=document.getElementById('mobileTabs');
 if(mobile){
  for(const x of mobileNodes)document.getElementById(x.dest).appendChild(x.node);
  tabs.hidden=false;showMobileTab(currentMobileTab);
 }else{
  for(const x of mobileNodes)x.marker.parentNode.insertBefore(x.node,x.marker.nextSibling);
  tabs.hidden=true;
 }
}
setupMobileNodes();
updateMobileLayout();
window.addEventListener('resize',updateMobileLayout);
</script></body></html>
